name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - feat/connectors-expanded

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: w3ads_ci_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d w3ads_ci_ephemeral"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: ci-local-secret-ci-local-secret-ci
      NEXTAUTH_SECRET: ci-local-secret-ci-local-secret-ci
      AUTH_DISABLED: "false"
      DEV_AUTH_BYPASS_EMAIL: gustavo@w3ads.local
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/w3ads_ci_ephemeral?schema=w3ads
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/w3ads_ci_ephemeral?schema=w3ads
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Reject sync-conflict shadow files
        run: |
          shadow=$(find . \( -name '* 2.*' -o -name '* 3.*' -o -name '* 2' -o -name '* 3' \) \
            -not -path './node_modules/*' -not -path './.git/*' -not -path './.next/*' || true)
          if [ -n "$shadow" ]; then
            echo "::error::Sync-conflict shadow files committed (rename/remove the ' 2.' / ' 3.' copies):"
            echo "$shadow"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Bootstrap Supabase compatibility
        run: npx prisma db execute --url "$DIRECT_URL" --file scripts/ci/bootstrap-supabase.sql
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build and migrations
        run: npm run build
      - name: Verify tenant RLS isolation
        run: npx prisma db execute --url "$DIRECT_URL" --file scripts/ci/verify-rls.sql
      - name: Seed E2E database
        run: node --import tsx prisma/seed.ts
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      - name: Dependency audit
        run: npm audit --audit-level=high
